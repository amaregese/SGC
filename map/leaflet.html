<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SGC Map</title>
    <link rel="stylesheet" href="leaflet.css"/>
    <script src="leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        html, body, #map { width: 100%; height: 100%; background: #0a1628; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    const map = L.map('map', {
        center: [9.145, 40.489],
        zoom: 6,
        zoomControl: false,
        attributionControl: false,
    });

    const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap',
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.control.attribution({ position: 'bottomleft', prefix: false }).addTo(map);

    function invalidateMapSize() {
        map.invalidateSize();
    }

    let vehicleMarker = null;
    let waypointLayer = null;
    let flightPathLayer = null;

    function updateVehiclePosition(lat, lon, heading) {
            if (vehicleMarker) {
                vehicleMarker.setLatLng([lat, lon]);
            } else {
                vehicleMarker = L.marker([lat, lon], {
                    icon: L.divIcon({
                        html: '<div style="background:#4fc3f7;width:14px;height:14px;border-radius:50%;border:3px solid white;box-shadow:0 0 8px rgba(79,195,247,0.6);"></div>',
                        iconSize: [20, 20],
                        className: ''
                    })
                }).addTo(map);
            }
    }

    function drawWaypoints(waypoints) {
        if (waypointLayer) map.removeLayer(waypointLayer);
        waypointLayer = L.layerGroup().addTo(map);
        waypoints.forEach((wp, i) => {
            L.circleMarker([wp.lat, wp.lon], {
                radius: 6, color: '#e67e22', fillColor: '#f39c12', fillOpacity: 0.8
            }).addTo(waypointLayer).bindPopup('WP ' + i + ': ' + wp.alt + 'm');
        });
    }

    function clearWaypoints() {
        if (waypointLayer) { map.removeLayer(waypointLayer); waypointLayer = null; }
    }

    function drawFlightPath(coords) {
        if (flightPathLayer) map.removeLayer(flightPathLayer);
        flightPathLayer = L.polyline(coords, { color: '#4fc3f7', weight: 2, opacity: 0.6 }).addTo(map);
    }
</script>
</body>
</html>
